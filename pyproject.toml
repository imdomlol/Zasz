[project]
name = "zasz"
version = "0.1.0"
description = "Zasz, a Zerg StarCraft II bot built on ares-sc2"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # ares-sc2 range; AI Arena runs 3.12
# What Zasz imports itself, not only through ares (AI Arena preinstalls these). python-sc2 (`sc2`) and
# map_analyzer come from ares' own git pins, so they stay ares' to choose
dependencies = [
    "ares-sc2",
    "numpy>=2",
    "scipy>=1.13",
    "loguru>=0.7",
    "aiohttp>=3.9",  # ladder.py
    "pyyaml>=6.0",  # scripts/create_ladder_zip.py
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
]

[tool.uv]
package = false  # a bot, not an installable library

[tool.uv.sources]
ares-sc2 = { path = "ares-sc2", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ares-sc2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# entry points set up sys.path for ares before importing it
"run.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "scenarios", "scripts", "fakes"]
known-third-party = ["ares", "sc2", "sc2_helper", "map_analyzer", "cython_extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # not ares-sc2's own tests
